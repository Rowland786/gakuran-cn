name: Publish Gakuran Chinese Wiki
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify published files
        run: |
          node -e "const f=require('fs');const w=JSON.parse(f.readFileSync('docs/data/wardrobe.json'));const r=JSON.parse(f.readFileSync('wiki/research/board-live.json'));const lists=new Set(r.lists.filter(x=>['Cosmetics','Faces (both genders)'].includes(x.name)).map(x=>x.id));const expected=new Set(r.cards.filter(c=>lists.has(c.idList)).flatMap(c=>c.attachments.map(a=>a.id)));const actual=new Set(w.items.flatMap(i=>i.media.map(a=>a.id)));if(!f.existsSync('docs/index.html')||!w.items.length||[...expected].some(id=>!actual.has(id))||actual.size!==expected.size||f.existsSync('docs/data/catalog.json')||f.existsSync('docs/mirror'))throw Error('Official wardrobe coverage mismatch');for(const i of w.items){if(!i.sourceURL.startsWith('https://trello.com/c/'))throw Error('Unofficial source');for(const a of i.media)for(const k of ['local','videoLocal','posterLocal'])if(a[k]&&!f.existsSync('docs/'+a[k]))throw Error(a[k]);}console.log('Official wardrobe media and provenance verified')"
          node -e "const f=require('fs');const b=JSON.parse(f.readFileSync('docs/data/board.json'));const raw=JSON.parse(f.readFileSync('wiki/research/board-live.json'));const videos=raw.cards.reduce((n,c)=>n+c.attachments.filter(a=>a.mimeType==='image/gif').length,0);if(b.cards.length!==raw.cards.length||b.stats.translatedCards!==raw.cards.length||b.stats.videos!==videos)throw Error('Board coverage mismatch');if(b.cards.map(c=>c.id).sort().join(',')!==raw.cards.map(c=>c.shortLink).sort().join(','))throw Error('Source IDs mismatch');for(const c of b.cards)for(const a of c.attachments)for(const k of ['local','videoLocal','posterLocal'])if(a[k]&&!f.existsSync('docs/'+a[k]))throw Error(a[k]);console.log('All source cards, translations, demos and attachments verified')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
